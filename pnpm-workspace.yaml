catalog:
  "@clanker-stuff/oxlint-config": 0.5.0
  "@effect/tsgo": 0.67.7
  "@gjermundgaraba/gg-theme": 0.4.1
  "@types/chrome": 0.3.7
  "@types/node": 26.6.6
  playwright: 1.65.0
  typescript: 7.0.2
  ultracite: 8.1.1
  vite: npm:@voidzero-dev/vite-plus-core@1.5.1
  vite-plus: 1.5.1
  vitest: 5.1.0
catalogMode: prefer
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - vite-plus
  - "@voidzero-dev/*"
  - oxlint
  - "@oxlint/*"
  - oxlint-tsgolint
  - "@oxlint-tsgolint/*"
  - oxfmt
  - "@oxfmt/*"
  - vitest
  - "@vitest/*"
  - "@gjermundgaraba/*"
  - "@effect/*"
  - "@clanker-stuff/*"
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  playwright: false
permissions:
  ultracite:
    skills: true
skills:
  dirs:
    - .agents/skills
    - .claude/skills
